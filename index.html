<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>44Finder</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg-secondary: #111118;
    --card-bg: #14141c;
    --card-border: rgba(255,255,255,.06);
    --text-primary: #f0f0f5;
    --text-secondary: #8d8d9c;
    --text-muted: #57576a;
    --accent: #6ee7b7;
    --accent-dim: rgba(110,231,183,.14);
    --steam-accent: #66c0f4;
    --epic-accent: #4d8cff;
    --border: rgba(255,255,255,.08);
    --radius: 14px;
    --radius-sm: 9px;
    --ease: cubic-bezier(.22,1,.36,1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
  }

  .app { max-width: 1280px; margin: 0 auto; padding: 0 1.25rem; }

  .topbar {
    position: sticky; top: 0; z-index: 100;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,15,.82);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
  }
  .topbar-inner {
    max-width: 1280px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; padding: .7rem 1.25rem;
  }
  .brand {
    font-weight: 800; font-size: 1.1rem; letter-spacing: -.4px;
    background: linear-gradient(135deg, var(--text-primary), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    white-space: nowrap;
  }
  .topbar-right { display: flex; align-items: center; gap: .5rem; }


  .counter {
    display: inline-flex; align-items: baseline; gap: .35rem;
    padding: .32rem .75rem; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 100px; font-size: .74rem; color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .counter-value { color: var(--accent); font-weight: 700; font-size: .88rem; }

  .github-link {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 100px; color: var(--text-secondary); transition: all .2s var(--ease);
  }
  .github-link:hover { color: var(--text-primary); border-color: rgba(255,255,255,.2); transform: translateY(-1px); }
  .github-link svg { width: 15px; height: 15px; fill: currentColor; }

  .hero { padding: 1.9rem 0 1.1rem; text-align: center; }
  .hero h1 {
    font-size: clamp(1.7rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -.8px; line-height: 1.1;
    margin-bottom: .35rem;
    background: linear-gradient(135deg, var(--text-primary), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .hero p { font-size: .92rem; color: var(--text-secondary); max-width: 440px; margin: 0 auto; }

  .controls {
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    padding: .7rem 1.25rem 1rem; flex-wrap: wrap;
  }
  .filters { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: center; }
  .filter-btn {
    background: transparent; color: var(--text-secondary); border: 1px solid var(--border);
    padding: .4rem 1rem; border-radius: 100px; cursor: pointer; font-size: .78rem; font-weight: 500;
    transition: all .18s var(--ease);
  }
  .filter-btn:hover { color: var(--text-primary); border-color: rgba(255,255,255,.16); background: rgba(255,255,255,.03); }
  .filter-btn.active { background: var(--accent); color: #06110c; border-color: var(--accent); font-weight: 700; }

  .search-wrap { position: relative; }
  .search-input {
    width: 200px; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-primary);
    padding: .4rem .8rem .4rem 2rem; border-radius: 100px; font-size: .8rem; outline: none;
    transition: border-color .18s var(--ease), width .18s var(--ease);
  }
  .search-input:focus { border-color: rgba(110,231,183,.4); width: 230px; }
  .search-icon {
    position: absolute; left: .65rem; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; stroke: var(--text-muted); pointer-events: none;
  }

  #games-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: .85rem; padding: .5rem 0 2.5rem;
  }

  .game-card {
    background: var(--card-bg); border-radius: var(--radius); overflow: hidden;
    display: flex; flex-direction: column; border: 1px solid var(--card-border);
    position: relative;
    transition: transform .28s var(--ease), box-shadow .28s var(--ease), border-color .28s var(--ease);
    content-visibility: auto; contain-intrinsic-size: 280px; contain: layout style paint;
    opacity: 0; transform: translateY(10px);
  }
  .game-card.visible { animation: cardEnter .45s var(--ease) forwards; }
  @keyframes cardEnter { to { opacity: 1; transform: translateY(0); } }

  .game-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--accent-line, var(--accent)); transform: scaleX(0); transform-origin: left;
    transition: transform .3s var(--ease); z-index: 2;
  }
  .game-card:hover::before { transform: scaleX(1); }
  .game-card:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(0,0,0,.45); border-color: rgba(255,255,255,.1); }

  .card-img-wrap { overflow: hidden; background: var(--bg-secondary); position: relative; }
  .game-card img {
    width: 100%; height: 140px; object-fit: cover; display: block; background: var(--bg-secondary);
    transition: transform .5s var(--ease); will-change: transform;
  }
  .game-card:hover img { transform: scale(1.045); }

  .card-content { padding: .85rem .9rem .9rem; flex-grow: 1; display: flex; flex-direction: column; }

  .platform-tags { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .5rem; }
  .platform-tag {
    display: inline-flex; align-items: center; gap: .3rem; padding: .18rem .5rem;
    border-radius: 5px; font-size: .63rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .3px; border: 1px solid; line-height: 1.4;
  }
  .tag-icon { width: 10px; height: 10px; stroke: currentColor; flex-shrink: 0; }
  .tag-steam { background: rgba(27,40,56,.7); color: var(--steam-accent); border-color: rgba(102,192,244,.2); }
  .tag-epic { background: rgba(25,32,58,.7); color: var(--epic-accent); border-color: rgba(77,140,255,.2); }
  .tag-other { background: rgba(255,255,255,.03); color: var(--text-secondary); border-color: var(--border); }

  .game-type { font-size: .63rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: .3rem; font-weight: 600; }
  .game-title {
    font-size: .93rem; margin-bottom: .35rem; font-weight: 650; line-height: 1.28;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .game-desc {
    font-size: .78rem; color: var(--text-secondary); flex-grow: 1; margin-bottom: .8rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.45;
  }

  .card-footer { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-top: auto; }
  .worth-badge { font-size: .73rem; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .claim-link {
    font-size: .73rem; color: var(--text-secondary); text-decoration: none; font-weight: 600;
    display: inline-flex; align-items: center; gap: .2rem; transition: color .18s var(--ease), gap .18s var(--ease);
  }
  .claim-link:hover { color: var(--accent); gap: .35rem; }

  .skeleton-card { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--card-border); }
  .skeleton-img { width: 100%; height: 140px; background: linear-gradient(90deg,#14141c 25%,#1c1c28 50%,#14141c 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  .skeleton-content { padding: .9rem; }
  .skeleton-text { height: 8px; background: linear-gradient(90deg,#14141c 25%,#1c1c28 50%,#14141c 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px; margin-bottom: .55rem; }
  .skeleton-text.short { width: 30%; } .skeleton-text.medium { width: 60%; } .skeleton-text.long { width: 95%; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .loader { text-align: center; padding: 3rem 1rem; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: .6rem; font-size: .88rem; }
  .loader::before { content: ''; width: 15px; height: 15px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .banner {
    display: none; align-items: center; justify-content: space-between; gap: .75rem;
    background: rgba(242,120,120,.08); border: 1px solid rgba(242,120,120,.25); color: #f2a3a3;
    padding: .6rem .9rem; border-radius: var(--radius-sm); font-size: .8rem; margin-bottom: .9rem;
  }
  .banner button {
    background: transparent; border: 1px solid rgba(242,120,120,.4); color: #f2a3a3;
    padding: .3rem .8rem; border-radius: 100px; cursor: pointer; font-size: .76rem; font-weight: 600;
    transition: all .18s var(--ease);
  }
  .banner button:hover { background: rgba(242,120,120,.15); }

  .no-results { text-align: center; padding: 3rem 1rem; color: var(--text-muted); grid-column: 1/-1; }
  .no-results-icon { font-size: 2.2rem; margin-bottom: .6rem; opacity: .4; }
  .no-results p { font-size: .95rem; margin-bottom: .3rem; }
  .no-results .sub { font-size: .8rem; color: var(--text-muted); }

  @media (max-width: 768px) {
    #games-grid { grid-template-columns: 1fr 1fr; gap: .6rem; padding: .5rem 0 2rem; }
    .game-card img { height: 110px; }
    .card-content { padding: .65rem .7rem .75rem; }
    .game-title { font-size: .82rem; }
    .game-desc { display: none; }
    .controls { padding: .6rem .8rem .8rem; }
    .search-input, .search-input:focus { width: 140px; }
    .topbar-inner { padding: .6rem .9rem; }
  }
  @media (max-width: 420px) {
    #games-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <span class="brand"></span>
      <div class="topbar-right">
        <div class="counter"><span id="game-count" class="counter-value">0</span><span>games</span></div>
        <a href="https://github.com/44tl" target="_blank" rel="noopener noreferrer" class="github-link" aria-label="GitHub">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        </a>
      </div>
    </div>
  </div>

  <div class="app">
    <div class="hero">
      <h1>44Finder</h1>
      <p>Live-tracked free giveaways from Steam and Epic Games.</p>
    </div>

    <div class="controls">
      <div class="filters">
        <button class="filter-btn active" data-platform="all">All</button>
        <button class="filter-btn" data-platform="steam">Steam</button>
        <button class="filter-btn" data-platform="epic">Epic Games</button>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search titles…">
      </div>
    </div>

    <div id="banner" class="banner">
      <span id="banner-text">Couldn't refresh — showing the last known list.</span>
      <button onclick="fetchFreeGames(true)">Retry now</button>
    </div>

    <div id="loader" class="loader">Loading free games</div>
    <div id="games-grid"></div>
  </div>

<script>
(function () {
  const API_URL = 'https://www.gamerpower.com/api/giveaways?platform=pc';
  const AUTO_REFRESH_MS = 5 * 60 * 1000;
  const FETCH_TIMEOUT_MS = 10000;
  const MAX_RETRIES = 3;

  let allGames = [];
  let currentPlatform = 'all';
  let currentQuery = '';
  let isFetching = false;
  let lastUpdated = null;
  let refreshTimer = null;
  let tickTimer = null;
  let hasLoadedOnce = false;

  const grid = document.getElementById('games-grid');
  const loader = document.getElementById('loader');
  const banner = document.getElementById('banner');
  const bannerText = document.getElementById('banner-text');
  const countEl = document.getElementById('game-count');
  const searchInput = document.getElementById('search-input');

  const escapeHtml = (t) => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };
  const parsePlatforms = (s) => (s ? s.split(',').map(p => p.trim()).filter(Boolean) : []);

  function tagClass(p) {
    const l = p.toLowerCase();
    if (l.includes('steam')) return 'tag-steam';
    if (l.includes('epic')) return 'tag-epic';
    return 'tag-other';
  }
  function accentFor(platforms) {
    const l = (platforms || '').toLowerCase();
    if (l.includes('steam')) return 'var(--steam-accent)';
    if (l.includes('epic')) return 'var(--epic-accent)';
    return 'var(--accent)';
  }
  const ICONS = {
    steam: `<svg class="tag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>`,
    epic: `<svg class="tag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
    other: `<svg class="tag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>`
  };
  function iconFor(p) {
    const l = p.toLowerCase();
    if (l.includes('steam')) return ICONS.steam;
    if (l.includes('epic')) return ICONS.epic;
    return ICONS.other;
  }
  function renderTags(platformsStr) {
    return parsePlatforms(platformsStr).map(p => {
      const label = p.length > 18 ? p.slice(0, 16) + '…' : p;
      return `<span class="platform-tag ${tagClass(p)}">${iconFor(p)}${escapeHtml(label)}</span>`;
    }).join('');
  }

  function updateTimestampText() {
    if (!lastUpdated) return;
    const secs = Math.round((Date.now() - lastUpdated) / 1000);
    let label;
    if (secs < 10) label = 'Updated just now';
    else if (secs < 60) label = `Updated ${secs}s ago`;
    else label = `Updated ${Math.round(secs / 60)}m ago`;
    document.title = `44Finder · ${allGames.length} games`;
  }

  function showSkeletons() {
    grid.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('div');
      s.className = 'skeleton-card';
      s.innerHTML = '<div class="skeleton-img"></div><div class="skeleton-content"><div class="skeleton-text short"></div><div class="skeleton-text medium"></div><div class="skeleton-text long"></div></div>';
      frag.appendChild(s);
    }
    grid.appendChild(frag);
  }

  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { rootMargin: '80px 0px' });

  function getFiltered() {
    let list = allGames;
    if (currentPlatform === 'steam') list = list.filter(g => g.platforms.includes('Steam'));
    else if (currentPlatform === 'epic') list = list.filter(g => g.platforms.includes('Epic Games Store'));
    if (currentQuery) {
      const q = currentQuery.toLowerCase();
      list = list.filter(g => g.title.toLowerCase().includes(q));
    }
    return list;
  }

  function displayGames() {
    const games = getFiltered();
    countEl.textContent = games.length;
    grid.innerHTML = '';

    if (games.length === 0) {
      grid.innerHTML = `<div class="no-results"><div class="no-results-icon">🎮</div><p>No matching games.</p><p class="sub">Try a different filter or search term.</p></div>`;
      return;
    }

    const frag = document.createDocumentFragment();
    games.forEach((game, i) => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.style.setProperty('--accent-line', accentFor(game.platforms));
      card.style.transitionDelay = `${Math.min(i * 0.02, 0.3)}s`;

      const cleanDesc = game.description ? game.description.replace(/<[^>]*>?/gm, '') : 'No description available.';
      const worth = game.worth && game.worth !== 'N/A' ? game.worth : 'Free';
      const typeLabel = game.type || 'Giveaway';
      const url = game.open_giveaway_url || game.gamerpower_url || '#';

      card.innerHTML = `
        <div class="card-img-wrap">
          <img src="${escapeHtml(game.thumbnail)}" alt="${escapeHtml(game.title)}" loading="lazy"
            onerror="this.onerror=null;this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 360%22><rect fill=%22%23111118%22 width=%22600%22 height=%22360%22/><text fill=%22%234a4a5a%22 font-family=%22sans-serif%22 font-size=%2220%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22>No Image</text></svg>';this.style.objectFit='contain';this.style.padding='30px';">
        </div>
        <div class="card-content">
          <div class="platform-tags">${renderTags(game.platforms)}</div>
          <div class="game-type">${escapeHtml(typeLabel)}</div>
          <h3 class="game-title">${escapeHtml(game.title)}</h3>
          <p class="game-desc">${escapeHtml(cleanDesc)}</p>
          <div class="card-footer">
            <span class="worth-badge">${escapeHtml(worth)}</span>
            <a class="claim-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Claim →</a>
          </div>
        </div>`;
      frag.appendChild(card);
      revealObserver.observe(card);
    });
    grid.appendChild(frag);
  }

  function fetchWithTimeout(url, ms) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), ms);
    return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(id));
  }

  async function fetchOnce() {
    const res = await fetchWithTimeout(API_URL, FETCH_TIMEOUT_MS);
    if (!res.ok) throw new Error('Bad response');
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('Unexpected payload');
    return data;
  }

  async function fetchFreeGames(manualRetry = false) {
    if (isFetching) return;
    isFetching = true;
    if (manualRetry) banner.style.display = 'none';
    if (!hasLoadedOnce) { loader.style.display = 'flex'; showSkeletons(); }

    let attempt = 0, lastErr = null;
    while (attempt < MAX_RETRIES) {
      try {
        const data = await fetchOnce();
        allGames = data.filter(g => g.platforms && (g.platforms.includes('Steam') || g.platforms.includes('Epic Games Store')));
        lastUpdated = Date.now();
        hasLoadedOnce = true;
        loader.style.display = 'none';
        banner.style.display = 'none';
        displayGames();
        break;
      } catch (err) {
        lastErr = err;
        attempt++;
        if (attempt < MAX_RETRIES) await new Promise(r => setTimeout(r, 600 * attempt));
      }
    }

    if (lastErr && attempt >= MAX_RETRIES) {
      loader.style.display = 'none';
      if (hasLoadedOnce) {
        bannerText.textContent = `Couldn't refresh — showing the last known list (${allGames.length} games).`;
        banner.style.display = 'flex';
      } else {
        grid.innerHTML = `<div class="no-results"><div class="no-results-icon">⚠️</div><p>Couldn't load games right now.</p><p class="sub">Check your connection and try again.</p></div>
          <div style="grid-column:1/-1;text-align:center;margin-top:.5rem;"><button class="filter-btn" onclick="fetchFreeGames(true)">Try again</button></div>`;
      }
    }

    isFetching = false;
    updateTimestampText();
    scheduleAutoRefresh();
  }
  window.fetchFreeGames = fetchFreeGames;

  function scheduleAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      if (!document.hidden) fetchFreeGames();
    }, AUTO_REFRESH_MS);
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      if (lastUpdated && Date.now() - lastUpdated > AUTO_REFRESH_MS) fetchFreeGames();
    }
  });

  if (tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(updateTimestampText, 15000);

  document.querySelectorAll('.filter-btn[data-platform]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelector('.filter-btn.active')?.classList.remove('active');
      btn.classList.add('active');
      currentPlatform = btn.dataset.platform;
      displayGames();
    });
  });

  let searchDebounce = null;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    const val = e.target.value;
    searchDebounce = setTimeout(() => { currentQuery = val.trim(); displayGames(); }, 150);
  });

  fetchFreeGames();
})();
</script>
</body>
</html>
